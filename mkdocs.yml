site_name: mlperf-sysinfo
site_description: Automatically capture the system description of a benchmarking machine.
site_url: https://docs.mlcommons.org/mlperf-sysinfo/
repo_url: https://github.com/mlcommons/mlperf-sysinfo
repo_name: mlcommons/mlperf-sysinfo
edit_uri: edit/main/docs/

theme:
  name: material
  logo: img/logo_v2.svg
  favicon: img/logo_v2.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    # No navigation.sections: it renders a nested group as a flat label with its
    # children flush against the top-level pages, so "endpoints" and "inference"
    # read as siblings of "Home" rather than as parts of the config file.
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Config File:
      - configuration/index.md
      - Endpoints: configuration/endpoints.md
      - Inference: configuration/inference.md
      - Training: configuration/training.md
  - Commands: commands.md
  - Sample outputs: outputs.md
  - Embedding it: embedding.md

validation:
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # base_path is resolved against the *config file*, not the working directory,
  # and check_paths turns a missing include into a build error. Without both, a
  # build started from another directory silently rendered the two template
  # blocks as empty -- and --strict said nothing.
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mlcommons/mlperf-sysinfo

copyright: Apache-2.0

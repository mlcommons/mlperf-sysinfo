name: Release

# Publishing PyPI is driven by GitHub Releases:
#
#   1. bump `version` in pyproject.toml on main,
#   2. draft a GitHub Release on a `v<version>` tag and publish it,
#   3. approve the `pypi` environment in the Actions tab.
#
# Only a *published* release triggers this -- saving a draft does nothing.
# The build runs the full test suite and refuses to continue if the release
# tag disagrees with the version in pyproject.toml, so the version on PyPI
# always matches the tag people can check out.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Tests must pass before anything is published
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run pytest -q

      - name: Build
        run: uv build

      - name: Verify the release tag matches the version in pyproject
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG="${TAG_NAME#v}"
          VERSION=$(uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG pyproject=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::release tag $TAG_NAME does not match project version $VERSION -- delete the release and its tag, fix pyproject.toml, and re-release"
            exit 1
          fi

      - name: Check distribution metadata
        run: uv tool run twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Requires a reviewer to approve the run before anything is uploaded.
    # A PyPI upload cannot be undone and its version can never be reused,
    # so this approval is the last chance to stop a bad release.
    environment:
      name: pypi
      url: https://pypi.org/p/mlperf-sysinfo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  attach-artifacts:
    name: attach the built distributions to the release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload the sdist and wheel to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

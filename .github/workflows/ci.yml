name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -q

      - name: CLI smoke test
        run: |
          uv run --python ${{ matrix.python-version }} mlperf-sysinfo --version
          uv run --python ${{ matrix.python-version }} mlperf-sysinfo profiles
          uv run --python ${{ matrix.python-version }} mlperf-sysinfo init endpoints --path /tmp/s.yaml
          # A starter config is deliberately not capturable: exit 1 is correct.
          uv run --python ${{ matrix.python-version }} mlperf-sysinfo check -c /tmp/s.yaml --offline && exit 1 || true

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Check metadata
        run: |
          uv tool run twine check dist/*
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --strict turns a broken link or a page missing from the nav into a
      # failure, so the docs cannot rot silently.
      - name: Build
        run: uv run --extra docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site/

  # Deploying is opt-in: GitHub Pages is unavailable for private repositories
  # on some plans, and a permanently red job teaches people to ignore CI.
  # To turn it on: make the repo public (or upgrade), set Settings -> Pages
  # -> Source to "GitHub Actions", then add a repository variable
  # ENABLE_PAGES = true. The build job above runs either way.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

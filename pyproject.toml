[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlperf-sysinfo"
version = "0.1.0"
description = "Capture MLPerf system descriptions: one config format, one CLI, per-working-group profiles."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "MLCommons contributors" }]
keywords = ["mlperf", "mlcommons", "benchmark", "system-info", "submission"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Benchmark",
]

dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "cyclopts>=3.0",
  "mlc-scripts>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
mlperf-sysinfo = "mlperf_sysinfo.cli:main"

[project.urls]
Homepage = "https://github.com/anandhu-eng/mlperf-sysinfo"
Repository = "https://github.com/anandhu-eng/mlperf-sysinfo"
Issues = "https://github.com/anandhu-eng/mlperf-sysinfo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mlperf_sysinfo"]

[tool.hatch.build.targets.sdist]
include = ["src/mlperf_sysinfo", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlperf-sysinfo"
version = "1.0.0a9"
description = "Automatically capture the system description of a benchmarking machine."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "MLCommons contributors" }]
keywords = ["mlperf", "mlcommons", "benchmark", "system-info", "submission"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Benchmark",
]

dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "cyclopts>=3.0",
  # Pinned exactly rather than floored. What this package composes is the
  # automation's field sets and input names, and a floor would let a later
  # release change either one under a config that has already been validated
  # against this one.
  #
  # 1.2.0a5 was the first release accepting the remote-provisioning inputs
  # the `remote:` section forwards (remote_isolated and its companions); on
  # 1.2.0a2 they are unknown inputs and go nowhere. 1.2.0a6 adds only the
  # system_name check moving into preprocess, which this package cannot
  # trigger -- system.name is a required config field, rejected at load long
  # before a node is contacted -- so the bump is to stay on the tested head
  # rather than to gain anything.
  #
  # Endpoints is the only profile being exercised against this pin. Its
  # builder in the automation is byte-for-byte identical to 1.2.0a2's, and the
  # single-node collector every profile shares did not change at all, so the
  # field set is the one already tested. What did change is that a node the
  # automation cannot reach now fails the whole collection instead of being
  # logged and skipped -- see collector.capture, which drops unreachable nodes
  # from the request so --allow-partial still means what it says.
  #
  # 1.2.0a5 also carries the _training variation that 1.2.0a2 lacked. That
  # unblocks the training profile at the automation level and nothing more:
  # it has not been run, and build_training's own guard is still the only
  # thing standing between it and a badly shaped file.
  "mlc-scripts==1.2.0a6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
]

[project.scripts]
mlperf-sysinfo = "mlperf_sysinfo.cli:main"

[project.urls]
Homepage = "https://github.com/mlcommons/mlperf-sysinfo"
Repository = "https://github.com/mlcommons/mlperf-sysinfo"
Documentation = "https://docs.mlcommons.org/mlperf-sysinfo/"
Issues = "https://github.com/mlcommons/mlperf-sysinfo/issues"

# mlc-scripts 1.2.0a6 depends on mlcflow>=1.4.0a4, itself a pre-release. pip
# allows this because the specifiers name pre-releases explicitly; uv needs to
# be told. This affects uv users only -- `pip install mlperf-sysinfo` resolves
# without any flag.
[tool.uv]
prerelease = "allow"

[tool.hatch.build.targets.wheel]
packages = ["src/mlperf_sysinfo"]

[tool.hatch.build.targets.sdist]
include = ["src/mlperf_sysinfo", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

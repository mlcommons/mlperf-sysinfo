name: inference
title: MLPerf Inference
round: "6.0"
description: >-
  MLPerf Inference submissions. Writes the flat field set the submission
  checker expects, with node hardware lifted to the top level.

output_file: system_desc.json
shape: flat
benchmark: inference

collect:
  serving_log: false
  endpoint_probe: false
  redfish: true

requires:
  system.name: Identifier for the system under test
  system.category: Maps to system_type in the submission
  system.availability: Maps to status in the submission
  submission.submitter: Organisation making the submission
  submission.contact: Contact email for questions about this submission
  submission.division: Submission division, e.g. closed or open

recommends:
  system.accelerator: Without it, accelerators are not probed at all
  submission.notes.software: The checker's sw_notes field
  submission.notes.hardware: The checker's hw_notes field

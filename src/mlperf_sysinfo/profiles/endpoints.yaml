name: endpoints
title: MLPerf Endpoints
round: "6.0"
description: >-
  Inference-serving endpoints. Writes the rules 8.2 field set.

output_file: system_desc.json
shape: nested
benchmark: endpoints

# redfish is off until the working group decides whether power belongs in an
# endpoints submission. The config still parses a power section -- inference
# and training collect it -- but for endpoints it is neither collected nor
# advertised, so nobody fills one in on the strength of a rule that does not
# exist yet.
collect:
  serving_log: true
  endpoint_probe: true
  redfish: false

# Model, dataset and concurrency details are no longer system description
# metadata: they belong to the measurement point (rules 8.3,
# points/<point>/config.yml), which this tool does not write. Nothing here
# should ask for them.
requires:
  system.name: Identifier for the system under test
  system.shortened_name: Short form of the name, at most 20 characters
  system.availability: Availability at submission time, e.g. available, preview or rdi
  submission.division: One of standardized, serviced or rdi
  serving.url: The endpoint under test

recommends:
  system.accelerator: Without it, accelerators are not probed at all
  system.cooling: Reviewers ask how the nodes are cooled
  serving.node: Enables parallelism and batch settings to be read from the startup log
  submission.notes.hardware: Hardware detail no probe can report, such as interconnect topology or firmware
  submission.notes.software: Software detail no probe can report, such as versions, flags or patches
  run.link_config: Reviewers use it to reproduce the run
